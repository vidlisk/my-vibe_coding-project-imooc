<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记一笔</title>
<style>
:root {
  --bg: #f5f5f3; --surface: #fff; --border: #e8e7e3;
  --ink: #1a1a1a; --ink2: #6b6b6b; --ink3: #a8a8a2;
  --expense: #e34948; --income: #1aaf70; --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111110; --surface: #1c1c1a; --border: #2e2e2c; --ink: #f0f0ec; --ink2: #c3c2b7; --ink3: #898781; }
}
body { background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; margin: 0; }
.tab-add, .tab-bills, .tab-stats, .tab-me { padding: 16px; padding-bottom: 80px; }
button { cursor: pointer; }
/* Nav */
nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
nav button { background: none; border: none; font-size: 12px; color: var(--ink3); padding: 4px 12px; }
nav button.active { color: var(--accent); }
/*记账*/
.month-nav { text-align: center; margin: 8px 0; }
.month-nav button { background: var(--surface); border: 1px solid var(--border); padding: 4px 12px; border-radius: 4px; color: var(--ink); }
.month-nav span { margin: 0 12px; font-size: 14px; }
.amount-display { text-align: center; font-size: 52px; font-weight: 700; color: var(--expense); margin: 12px 0; font-variant-numeric: tabular-nums; }
.amount-display.income { color: var(--income); }
.amount-input { display: block; width: 90%; margin: 0 auto; font-size: 28px; text-align: center; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink); }
.type-btns { display: flex; justify-content: center; gap: 16px; margin: 12px 0; }
.type-btns button { padding: 8px 28px; border: none; border-radius: 20px; font-size: 14px; }
.type-btns button.expense { background: var(--expense); color: #fff; }
.type-btns button.expense.inactive { background: var(--surface); color: var(--ink2); border: 1px solid var(--border); }
.type-btns button.income { background: var(--income); color: #fff; }
.type-btns button.income.inactive { background: var(--surface); color: var(--ink2); border: 1px solid var(--border); }
.scope-tabs { display: flex; justify-content: center; gap: 8px; margin: 8px 0; font-size: 12px; color: var(--ink3); }
.scope-tabs span { cursor: pointer; padding: 2px 8px; }
.scope-tabs span.active { color: var(--accent); font-weight: bold; }
.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px; }
.cat-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 4px; font-size: 11px; text-align: center; cursor: pointer; transition: all .15s; }
.cat-btn:active { background: var(--accent); color: #fff; border-color: var(--accent); }
.cat-btn .icon { font-size: 22px; display: block; } .cat-btn .name { display: block; margin-top: 2px; }
/*账单*/
.day-group { margin-bottom: 4px; }
.day-header { background: var(--surface); padding: 8px 12px; font-size: 12px; color: var(--ink2); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
.txn-item { background: var(--surface); padding: 12px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); cursor: pointer; }
.txn-item:active { background: var(--bg); }
.txn-icon { font-size: 22px; }
.txn-info { flex: 1; }
.txn-name { font-size: 14px; }
.txn-note { font-size: 12px; color: var(--ink3); }
.txn-amount { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.txn-amount.expense { color: var(--expense); }
.txn-amount.income { color: var(--income); }
/*统计*/
.stats-cards { display: flex; justify-content: space-around; background: var(--surface); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.stats-card { text-align: center; }
.stats-card .val { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stats-card .lbl { font-size: 11px; color: var(--ink3); margin-top: 2px; }
.donut-wrap { text-align: center; margin: 16px 0; }
.donut-wrap svg { max-width: 220px; }
/*Sheet*/
#sheet-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; }
#sheet { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-radius: 16px 16px 0 0; padding: 20px; z-index: 201; max-height: 80vh; overflow-y: auto; }
#sheet h3 { margin: 0 0 16px; text-align: center; }
#sheet .del-btn { display: block; width: 100%; padding: 12px; background: var(--expense); color: #fff; border: none; border-radius: 8px; margin-top: 12px; }
.sheet-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
#toast { display: none; position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fff; padding: 8px 20px; border-radius: 20px; font-size: 13px; z-index: 300; }
</style>
</head>
<body>

<nav>
  <button id="nav-add" onclick="showTab('add')">记账</button>
  <button id="nav-bills" onclick="showTab('bills')">账单</button>
  <button id="nav-stats" onclick="showTab('stats')">统计</button>
  <button id="nav-me" onclick="showTab('me')">我的</button>
</nav>

<!-- Tab1: 记账 -->
<div class="tab-add">
  <div class="month-nav"><button onclick="chgMonth(-1)">&lt;</button><span id="lbl-month">2026年8月</span><button onclick="chgMonth(1)">&gt;</button></div>
  <div class="amount-display" id="amount-display">0.00</div>
  <div id="budget-bar-wrap" style="padding:0 16px;margin-bottom:8px;display:none;">
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-bottom:4px;"><span>预算进度</span><span id="budget-pct">0%</span></div>
    <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden;"><div id="budget-fill" style="height:100%;width:0%;border-radius:3px;transition:width .3s;"></div></div>
  </div>
  <input class="amount-input" id="amount-input" type="number" step="0.01" placeholder="输入金额" inputmode="decimal">
  <div class="type-btns">
    <button class="expense" id="btn-exp" onclick="setType('expense')">支出</button>
    <button class="income inactive" id="btn-inc" onclick="setType('income')">收入</button>
  </div>
  <div class="scope-tabs"><span class="active" onclick="setScope('personal')" id="scope-personal">个人</span><span onclick="setScope('business')" id="scope-business">经营</span></div>
  <div class="cat-grid" id="cat-grid"></div>
</div>

<!-- Tab2: 账单 -->
<div class="tab-bills" style="display:none">
  <div class="month-nav"><button onclick="chgMonth(-1)">&lt;</button><span id="lbl-month2">2026年8月</span><button onclick="chgMonth(1)">&gt;</button></div>
  <div id="bills-list"></div>
</div>

<!-- Tab3: 统计 -->
<div class="tab-stats" style="display:none">
  <div class="month-nav"><button onclick="chgMonth(-1)">&lt;</button><span id="lbl-month3">2026年8月</span><button onclick="chgMonth(1)">&gt;</button></div>
  <div id="stats-cards" class="stats-cards"></div>
  <div class="donut-wrap" id="donut-wrap"></div>
  <div id="donut-legend" style="font-size:12px;color:var(--ink2);padding:0 16px;"></div>
  <div id="trend-section" style="margin-top:20px;">
    <div style="font-size:13px;font-weight:bold;margin:12px 0 8px;">月度趋势</div>
    <div id="trend-chart" style="padding:0 8px;"></div>
  </div>
</div>

<!-- Tab4: 我的 -->
<div class="tab-me" style="display:none">
  <h3 style="margin:0 0 16px;">我的</h3>
  <div class="sheet-row" style="cursor:pointer" onclick="showLedgerMgr()">账本管理 <span style="color:var(--ink3);font-size:12px;">→</span> <span id="cur-ledger-name" style="color:var(--accent);font-size:12px;"></span></div>
  <div class="sheet-row" style="cursor:pointer" onclick="showCatMgr()">分类管理 →</div>
  <div class="sheet-row" style="cursor:pointer" onclick="showBudgetMgr()">预算设置 <span id="budget-summary" style="color:var(--ink3);font-size:12px;"></span> →</div>
  <div class="sheet-row" style="cursor:pointer" onclick="doExport()">数据导出 →</div>
  <div class="sheet-row"><label style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;"><span>暗色模式</span><input type="checkbox" id="dark-chk" onchange="toggleDark()"></label></div>
  <div class="sheet-row" style="cursor:pointer" onclick="doLogout()">退出登录</div>
</div>

<!-- 账本管理 Sheet -->
<div id="ledger-sheet" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;" onclick="if(event.target===this)this.style.display='none'">
  <div style="position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-radius:16px 16px 0 0;padding:20px;max-height:70vh;overflow-y:auto;">
    <h3 style="margin:0 0 12px;text-align:center;">账本管理</h3>
    <div id="ledger-list"></div>
    <button onclick="addLedger()" style="width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:8px;margin-top:10px;font-size:14px;">+ 新建账本</button>
    <button onclick="document.getElementById('ledger-sheet').style.display='none'" style="width:100%;padding:10px;border:1px solid var(--border);background:var(--surface);margin-top:6px;font-size:14px;">关闭</button>
  </div>
</div>

<!-- 预算设置 Sheet -->
<div id="budget-sheet" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;" onclick="if(event.target===this)this.style.display='none'">
  <div style="position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-radius:16px 16px 0 0;padding:20px;max-height:70vh;overflow-y:auto;">
    <h3 style="margin:0 0 12px;text-align:center;">预算设置</h3>
    <div class="sheet-row"><span>月总预算</span><input id="budget-total" type="number" placeholder="如 5000" style="width:120px;font-size:14px;padding:4px;"></div>
    <div id="cat-budget-rows"></div>
    <button onclick="saveBudget()" style="width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:8px;margin-top:12px;font-size:14px;">保存</button>
    <button onclick="document.getElementById('budget-sheet').style.display='none'" style="width:100%;padding:10px;border:1px solid var(--border);background:var(--surface);margin-top:6px;font-size:14px;">关闭</button>
  </div>
</div>

<!-- 分类管理 Sheet -->
<div id="catmgr-sheet" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;" onclick="if(event.target===this)this.style.display='none'">
  <div style="position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-radius:16px 16px 0 0;padding:20px;max-height:70vh;overflow-y:auto;">
    <h3 style="margin:0 0 12px;text-align:center;">分类管理</h3>
    <div id="catmgr-list"></div>
    <button onclick="document.getElementById('catmgr-sheet').style.display='none'" style="width:100%;padding:10px;border:1px solid var(--border);background:var(--surface);margin-top:10px;font-size:14px;">关闭</button>
  </div>
</div>

<!-- 编辑 Sheet -->
<div id="sheet-overlay" onclick="closeSheet()"></div>
<div id="sheet">
  <h3 id="sheet-title">编辑</h3>
  <div class="sheet-row"><span>金额</span><input id="sheet-amount" type="number" step="0.01" style="width:120px;font-size:14px;padding:4px;"></div>
  <div class="sheet-row"><span>类型</span><select id="sheet-type" style="font-size:14px;padding:4px;"><option value="expense">支出</option><option value="income">收入</option></select></div>
  <div class="sheet-row"><span>时间</span><input id="sheet-time" type="datetime-local" style="font-size:14px;padding:4px;"></div>
  <div class="sheet-row"><span>备注</span><input id="sheet-note" type="text" style="font-size:14px;padding:4px;"></div>
  <button class="del-btn" onclick="delCurrent()">删除此笔</button>
  <button onclick="copyCurrent()" style="display:block;width:100%;padding:10px;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;margin-top:8px;font-size:14px;">复制此笔</button>
  <button onclick="saveSheet()" style="display:block;width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;margin-top:8px;">保存</button>
</div>

<div id="toast"></div>

<script>
const CATS = {
  expense_personal:[{id:'c1',name:'餐饮',icon:'🍜'},{id:'c2',name:'交通',icon:'🚗'},{id:'c3',name:'购物',icon:'🛒'},{id:'c4',name:'居住',icon:'🏠'},{id:'c5',name:'娱乐',icon:'🎮'},{id:'c6',name:'医疗',icon:'💊'},{id:'c7',name:'学习',icon:'📚'},{id:'c8',name:'人情',icon:'🎁'},{id:'c9',name:'其他',icon:'···'}],
  income_personal:[{id:'c10',name:'工资',icon:'💰'},{id:'c11',name:'奖金',icon:'🎉'},{id:'c12',name:'理财',icon:'📈'},{id:'c13',name:'兼职',icon:'💼'},{id:'c14',name:'其他',icon:'···'}],
  expense_business:[{id:'b1',name:'进货成本',icon:'📦'},{id:'b2',name:'房租/摊位',icon:'🏢'},{id:'b3',name:'员工工资',icon:'👥'},{id:'b4',name:'水电',icon:'💡'},{id:'b5',name:'税费',icon:'📋'},{id:'b6',name:'物流',icon:'🚚'},{id:'b7',name:'设备',icon:'🔧'},{id:'b8',name:'其他',icon:'···'}],
  income_business:[{id:'bi1',name:'销售收入',icon:'🏪'},{id:'bi2',name:'服务收入',icon:'🔧'},{id:'bi3',name:'其他经营',icon:'💼'}]
};
const PALETTE = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];

let state = {
  txns: JSON.parse(localStorage.getItem('jtb_txns') || '[]'),
  type: 'expense', scope: 'personal',
  month: new Date(),
  editingId: null
};

function save() { localStorage.setItem('jtb_txns', JSON.stringify(state.txns)); }

function showTab(name) {
  document.querySelectorAll('.tab-add,.tab-bills,.tab-stats,.tab-me').forEach((el,i) => {
    el.style.display = ['add','bills','stats','me'][i] === name ? 'block' : 'none';
  });
  document.querySelectorAll('nav button').forEach((b,i) => b.classList.toggle('active', ['add','bills','stats','me'][i] === name));
  if (name === 'bills') renderBills();
  if (name === 'stats') renderStats();
}

function chgMonth(d) {
  state.month.setMonth(state.month.getMonth() + d);
  updateLabels();
  renderBills(); renderStats(); updateBudgetBar();
}

function updateLabels() {
  const y = state.month.getFullYear(), m = state.month.getMonth() + 1;
  const lbl = y + '年' + m + '月';
  document.getElementById('lbl-month').textContent = lbl;
  const el2 = document.getElementById('lbl-month2');
  if (el2) el2.textContent = lbl;
  const el3 = document.getElementById('lbl-month3');
  if (el3) el3.textContent = lbl;
}

function setType(t) {
  state.type = t;
  const de = document.getElementById('btn-exp'), di = document.getElementById('btn-inc');
  de.className = 'expense' + (t === 'expense' ? '' : ' inactive');
  di.className = 'income' + (t === 'income' ? '' : ' inactive');
  document.getElementById('amount-display').className = 'amount-display ' + (t === 'income' ? 'income' : '');
  renderCats();
}

function setScope(s) {
  state.scope = s;
  document.getElementById('scope-personal').classList.toggle('active', s === 'personal');
  document.getElementById('scope-business').classList.toggle('active', s === 'business');
  renderCats();
}

function renderCats() {
  const cats = CATS[state.type + '_' + state.scope];
  const grid = document.getElementById('cat-grid');
  grid.innerHTML = '';
  cats.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.innerHTML = '<span class="icon">' + c.icon + '</span><span class="name">' + c.name + '</span>';
    btn.onclick = () => addTxn(c.id, c.name, c.icon);
    grid.appendChild(btn);
  });
}

function addTxn(catId, catName, catIcon) {
  const amt = parseFloat(document.getElementById('amount-input').value);
  if (!amt || amt <= 0) { showToast('请输入金额'); return; }
  state.txns.unshift({
    id: Date.now() + '', ledger_id: 'l1', member_id: 'm1',
    type: state.type, amount: amt, category_id: catId,
    occurred_at: new Date().toISOString(), note: '', created_at: new Date().toISOString()
  });
  save();
  document.getElementById('amount-input').value = '';
  document.getElementById('amount-display').textContent = '0.00';
  showToast((state.type === 'expense' ? '支出' : '收入') + ' ¥' + amt.toFixed(2) + ' ' + catName);
}

document.getElementById('amount-input').addEventListener('input', function() {
  document.getElementById('amount-display').textContent = this.value || '0.00';
});

function getMonthTxns() {
  const y = state.month.getFullYear(), m = state.month.getMonth();
  return state.txns.filter(t => {
    const d = new Date(t.occurred_at);
    return d.getFullYear() === y && d.getMonth() === m;
  });
}

function renderBills() {
  const list = document.getElementById('bills-list');
  const txns = getMonthTxns();
  if (!txns.length) { list.innerHTML = '<p style="text-align:center;color:var(--ink3);margin-top:40px;">暂无流水记录</p>'; return; }
  const groups = {};
  txns.forEach(t => {
    const day = t.occurred_at.slice(0, 10);
    if (!groups[day]) groups[day] = [];
    groups[day].push(t);
  });
  let html = '';
  Object.keys(groups).sort().reverse().forEach(day => {
    const expSum = groups[day].filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    const incSum = groups[day].filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    html += '<div class="day-header"><span>' + day + '</span><span>支 <b style="color:var(--expense)">¥' + expSum.toFixed(2) + '</b>  收 <b style="color:var(--income)">¥' + incSum.toFixed(2) + '</b></span></div>';
    groups[day].sort((a, b) => b.occurred_at.localeCompare(a.occurred_at)).forEach(t => {
      const cat = CATS[t.type + '_personal'].concat(CATS[t.type + '_business']).find(c => c.id === t.category_id) || {icon:'?', name: t.category_id};
      html += '<div class="txn-item" onclick="openEdit(\'' + t.id + '\')">';
      html += '<span class="txn-icon">' + cat.icon + '</span>';
      html += '<div class="txn-info"><div class="txn-name">' + cat.name + '</div>' + (t.note ? '<div class="txn-note">' + t.note + '</div>' : '') + '</div>';
      html += '<span class="txn-amount ' + t.type + '">' + (t.type === 'expense' ? '-' : '+') + '¥' + t.amount.toFixed(2) + '</span></div>';
    });
  });
  list.innerHTML = html;
}

function getMonthTotal(y, m, type) {
  return state.txns.filter(t => {
    const d = new Date(t.occurred_at);
    return d.getFullYear() === y && d.getMonth() === m && t.type === type;
  }).reduce((s, t) => s + t.amount, 0);
}

function renderStats() {
  const y = state.month.getFullYear(), m = state.month.getMonth();
  const txns = getMonthTxns();
  const exp = txns.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
  const inc = txns.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);

  // 上月数据
  const lm = m === 0 ? 11 : m - 1, ly = m === 0 ? y - 1 : y;
  const expPrev = getMonthTotal(ly, lm, 'expense');
  const incPrev = getMonthTotal(ly, lm, 'income');

  function delta(cur, prev) {
    if (!prev) return '<span style="font-size:11px;color:var(--ink3)">—</span>';
    const d = ((cur - prev) / prev * 100).toFixed(1);
    return '<span style="font-size:11px;color:' + (d > 0 ? 'var(--expense)' : 'var(--income)') + '">' + (d > 0 ? '▲' : '▼') + Math.abs(d) + '%</span>';
  }

  document.getElementById('stats-cards').innerHTML =
    '<div class="stats-card"><div class="val" style="color:var(--expense)">¥' + exp.toFixed(2) + '</div><div class="lbl">支出 ' + delta(exp, expPrev) + '</div></div>' +
    '<div class="stats-card"><div class="val" style="color:var(--income)">¥' + inc.toFixed(2) + '</div><div class="lbl">收入 ' + delta(inc, incPrev) + '</div></div>' +
    '<div class="stats-card"><div class="val">¥' + (inc - exp).toFixed(2) + '</div><div class="lbl">结余</div></div>';
  renderDonut(txns.filter(t => t.type === 'expense'));
  renderTrend();
}

function renderDonut(txns) {
  if (!txns.length) {
    document.getElementById('donut-wrap').innerHTML = '<p style="color:var(--ink3);padding:40px;text-align:center;">本月暂无支出记录</p>';
    document.getElementById('donut-legend').innerHTML = '';
    return;
  }
  const byCat = {};
  txns.forEach(t => {
    const cat = CATS.expense_personal.concat(CATS.expense_business).find(c => c.id === t.category_id) || {name: t.category_id, icon: '?'};
    if (!byCat[cat.name]) byCat[cat.name] = { amount: 0, icon: cat.icon };
    byCat[cat.name].amount += t.amount;
  });
  const total = Object.values(byCat).reduce((s, v) => s + v.amount, 0);
  const entries = Object.entries(byCat).sort((a, b) => b[1].amount - a[1].amount);
  // Draw SVG donut
  const cx = 110, cy = 110, r1 = 90, r2 = 55;
  let paths = '', startAngle = -90;
  entries.forEach(([name, data], i) => {
    const pct = data.amount / total;
    const angle = pct * 360;
    const color = PALETTE[i % PALETTE.length];
    const sa = startAngle * Math.PI / 180;
    const ea = (startAngle + angle) * Math.PI / 180;
    const x1 = cx + r1 * Math.cos(sa), y1 = cy + r1 * Math.sin(sa);
    const x2 = cx + r1 * Math.cos(ea), y2 = cy + r1 * Math.sin(ea);
    const x3 = cx + r2 * Math.cos(ea), y4 = cy + r2 * Math.sin(ea);
    const x4 = cx + r2 * Math.cos(sa), y5 = cy + r2 * Math.sin(sa);
    const large = angle > 180 ? 1 : 0;
    paths += '<path d="M' + x1 + ',' + y1 + ' A' + r1 + ',' + r1 + ' 0,' + large + ',1 ' + x2 + ',' + y2 + ' L' + x3 + ',' + y4 + ' A' + r2 + ',' + r2 + ' 0,' + large + ',0 ' + x4 + ',' + y5 + ' Z" fill="' + color + '" opacity="0.85" onclick="showToast(\'' + name + ': ¥' + data.amount.toFixed(2) + '\')" style="cursor:pointer"/>';
    startAngle += angle;
  });
  document.getElementById('donut-wrap').innerHTML = '<svg viewBox="0 0 220 220" width="220" height="220">' + paths + '<text x="' + cx + '" y="' + (cy - 5) + '" text-anchor="middle" font-size="12" fill="var(--ink2)">支出</text><text x="' + cx + '" y="' + (cy + 14) + '" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--ink)">¥' + total.toFixed(0) + '</text></svg>';
  // Legend
  let legHtml = '<table style="width:100%;font-size:12px;">';
  // 精确到小数后一位，总和=100%（dataviz spec）
  const pctRounded = entries.map(([name, data]) => parseFloat((data.amount / total * 100).toFixed(1)));
  const pctSum = pctRounded.reduce((s, v) => s + v, 0);
  if (pctSum !== 100) pctRounded[pctRounded.length - 1] = parseFloat((pctRounded[pctRounded.length - 1] + (100 - pctSum)).toFixed(1));

  entries.forEach(([name, data], i) => {
    const pct = pctRounded[i];
    legHtml += '<tr><td style="color:' + PALETTE[i % PALETTE.length] + '">' + data.icon + '</td><td>' + name + '</td><td style="text-align:right;">¥' + data.amount.toFixed(2) + '</td><td style="text-align:right;color:var(--ink3);">' + pct + '%</td></tr>';
  });
  legHtml += '</table>';
  document.getElementById('donut-legend').innerHTML = legHtml;
}

function renderTrend() {
  const el = document.getElementById('trend-chart');
  const y = state.month.getFullYear(), m = state.month.getMonth();
  // 近3个月
  const months = [];
  for (let i = 2; i >= 0; i--) {
    let mm = m - i, yy = y;
    if (mm < 0) { mm += 12; yy--; }
    months.push({ y: yy, m: mm });
  }
  const expData = months.map(({ y, m }) => getMonthTotal(y, m, 'expense'));
  const incData = months.map(({ y, m }) => getMonthTotal(y, m, 'income'));

  const W = 300, H = 120, pad = 30;
  const allVals = [...expData, ...incData];
  const maxV = Math.max(...allVals, 1);
  const xStep = (W - pad * 2) / Math.max(months.length - 1, 1);

  function toXY(vals, yOffset) {
    return vals.map((v, i) => {
      const x = pad + i * xStep;
      const y = yOffset + (1 - v / maxV) * (H - pad * 2);
      return [x, y];
    });
  }

  const expPts = toXY(expData, pad);
  const incPts = toXY(incData, pad);

  function polyline(pts) {
    return pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0] + ',' + p[1]).join(' ');
  }

  function endpoint(pts, color) {
    return pts.map(p => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="' + color + '" stroke="var(--surface)" stroke-width="2"/>').join('');
  }

  const monthLabels = months.map(({ y, m }) => (m + 1) + '月').join(' ');
  el.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
      <!-- Gridlines -->
      <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H - pad}" stroke="var(--border)" stroke-width="1"/>
      <line x1="${pad}" y1="${H - pad}" x2="${W - pad}" y2="${H - pad}" stroke="var(--border)" stroke-width="1"/>
      <line x1="${pad}" y1="${pad}" x2="${W - pad}" y2="${pad}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4"/>
      <line x1="${pad}" y1="${pad + (H - pad * 2) / 2}" x2="${W - pad}" y2="${pad + (H - pad * 2) / 2}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4"/>
      <!-- Expense line -->
      <path d="${polyline(expPts)}" stroke="var(--expense)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      ${endpoint(expPts, 'var(--expense)')}
      <!-- Income line -->
      <path d="${polyline(incPts)}" stroke="var(--income)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      ${endpoint(incPts, 'var(--income)')}
      <!-- Labels -->
      ${expPts.map((p, i) => '<text x="' + p[0] + '" y="' + (H - 4) + '" text-anchor="middle" font-size="10" fill="var(--ink3)">' + (months[i].m + 1) + '月</text>').join('')}
      <!-- Value labels at endpoints -->
      <text x="${expPts[expPts.length - 1][0] + 6}" y="${expPts[expPts.length - 1][1] + 4}" font-size="10" fill="var(--expense)">¥${expData[expData.length - 1].toFixed(0)}</text>
      <text x="${incPts[incPts.length - 1][0] + 6}" y="${incPts[incPts.length - 1][1] + 4}" font-size="10" fill="var(--income)">¥${incData[incData.length - 1].toFixed(0)}</text>
    </svg>
    <div style="display:flex;gap:16px;font-size:11px;justify-content:center;margin-top:4px;">
      <span style="color:var(--expense)">● 支出</span><span style="color:var(--income)">● 收入</span>
    </div>`;
}

function openEdit(id) {
  state.editingId = id;
  const t = state.txns.find(t => t.id === id);
  if (!t) return;
  document.getElementById('sheet-title').textContent = '编辑流水';
  document.getElementById('sheet-amount').value = t.amount;
  document.getElementById('sheet-type').value = t.type;
  document.getElementById('sheet-time').value = t.occurred_at.slice(0, 16);
  document.getElementById('sheet-note').value = t.note || '';
  document.getElementById('sheet-overlay').style.display = 'block';
  document.getElementById('sheet').style.display = 'block';
}

function closeSheet() {
  document.getElementById('sheet-overlay').style.display = 'none';
  document.getElementById('sheet').style.display = 'none';
  state.editingId = null;
}

function saveSheet() {
  const t = state.txns.find(t => t.id === state.editingId);
  if (!t) return;
  t.amount = parseFloat(document.getElementById('sheet-amount').value) || 0;
  t.type = document.getElementById('sheet-type').value;
  t.occurred_at = document.getElementById('sheet-time').value;
  t.note = document.getElementById('sheet-note').value;
  save();
  closeSheet();
  renderBills();
  showToast('已保存');
}

function delCurrent() {
  if (!confirm('删除此笔？')) return;
  state.txns = state.txns.filter(t => t.id !== state.editingId);
  save();
  closeSheet();
  renderBills();
  showToast('已删除');
}

function copyCurrent() {
  const t = state.txns.find(t => t.id === state.editingId);
  if (!t) return;
  state.txns.unshift({ ...t, id: Date.now() + '', occurred_at: new Date().toISOString(), created_at: new Date().toISOString() });
  save();
  closeSheet();
  renderBills();
  showToast('已复制');
}

function doExport() {
  let csv = '﻿日期,类型,分类,金额,备注\n';
  state.txns.forEach(t => {
    const cat = CATS[t.type + '_personal'].concat(CATS[t.type + '_business']).find(c => c.id === t.category_id) || {name: ''};
    csv += [t.occurred_at.slice(0, 10), t.type, cat.name, t.amount, '"' + (t.note || '') + '"'].join(',') + '\n';
  });
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'jiyibi_' + new Date().toISOString().slice(0, 7) + '.csv';
  a.click();
  showToast('CSV 已导出');
}

function toggleDark() {
  const on = document.getElementById('dark-chk').checked;
  document.documentElement.style.setProperty('--bg', on ? '#111110' : '#f5f5f3');
  document.documentElement.style.setProperty('--surface', on ? '#1c1c1a' : '#fff');
  document.documentElement.style.setProperty('--border', on ? '#2e2e2c' : '#e8e7e3');
  document.documentElement.style.setProperty('--ink', on ? '#f0f0ec' : '#1a1a1a');
  document.documentElement.style.setProperty('--ink2', on ? '#c3c2b7' : '#6b6b6b');
  document.documentElement.style.setProperty('--ink3', on ? '#898781' : '#a8a8a2');
  localStorage.setItem('jtb_dark', on ? '1' : '0');
}

function doLogout() { if (confirm('确定退出？')) { localStorage.clear(); location.reload(); } }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 1600);
}

// ====== 账本管理 ======
function getLedgers() {
  let ls = JSON.parse(localStorage.getItem('jtb_ledgers') || 'null');
  if (!ls) { ls = [{ id: 'l1', name: '我的账本', type: 'personal' }]; localStorage.setItem('jtb_ledgers', JSON.stringify(ls)); }
  return ls;
}
function getCurrentLedgerId() { return localStorage.getItem('jtb_cur_ledger') || 'l1'; }

function showLedgerMgr() {
  const ls = getLedgers(), cur = getCurrentLedgerId();
  const el = document.getElementById('ledger-list');
  el.innerHTML = ls.map(l => '<div onclick="switchLedger(\'' + l.id + '\')" style="padding:10px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;cursor:pointer;' + (l.id === cur ? 'background:var(--bg);' : '') + '"><span>' + l.name + '</span>' + (l.id === cur ? '<span style="color:var(--accent);font-size:12px;">当前</span>' : '') + '</div>').join('');
  document.getElementById('ledger-sheet').style.display = 'block';
  document.getElementById('cur-ledger-name').textContent = ls.find(l => l.id === cur)?.name || '';
}

function switchLedger(id) {
  localStorage.setItem('jtb_cur_ledger', id);
  document.getElementById('ledger-sheet').style.display = 'none';
  showToast('已切换账本');
}

function addLedger() {
  const name = prompt('输入账本名称：');
  if (!name) return;
  const ls = getLedgers();
  ls.push({ id: Date.now() + '', name, type: 'personal' });
  localStorage.setItem('jtb_ledgers', JSON.stringify(ls));
  showLedgerMgr();
  showToast('账本已创建');
}

// ====== 预算管理 ======
function getBudgets() { return JSON.parse(localStorage.getItem('jtb_budgets') || '[]'); }

function getBudgetTotal() {
  const y = state.month.getFullYear(), m = state.month.getMonth();
  const bs = getBudgets().find(b => b.ledger_id === getCurrentLedgerId() && b.year === y && b.month === m && !b.category_id);
  return bs ? bs.amount : 0;
}

function showBudgetMgr() {
  const y = state.month.getFullYear(), m = state.month.getMonth();
  const bs = getBudgets().find(b => b.ledger_id === getCurrentLedgerId() && b.year === y && b.month === m && !b.category_id);
  document.getElementById('budget-total').value = bs ? bs.amount : '';
  const cats = CATS.expense_personal;
  const catBs = getBudgets().filter(b => b.ledger_id === getCurrentLedgerId() && b.year === y && b.month === m && b.category_id);
  document.getElementById('cat-budget-rows').innerHTML = cats.slice(0, 4).map(c => {
    const b = catBs.find(b => b.category_id === c.id);
    return '<div class="sheet-row"><span>' + c.icon + ' ' + c.name + '</span><input id="bcat_' + c.id + '" type="number" placeholder="分类预算" value="' + (b ? b.amount : '') + '" style="width:100px;font-size:14px;padding:4px;"></div>';
  }).join('');
  document.getElementById('budget-sheet').style.display = 'block';
  // Update summary
  const total = getBudgetTotal();
  const exp = getMonthTxns().filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
  if (total > 0) {
    const pct = Math.round(exp / total * 100);
    document.getElementById('budget-summary').textContent = exp.toFixed(0) + '/' + total + ' (' + pct + '%)';
  } else {
    document.getElementById('budget-summary').textContent = '未设置';
  }
}

function saveBudget() {
  const total = parseFloat(document.getElementById('budget-total').value) || 0;
  const y = state.month.getFullYear(), m = state.month.getMonth();
  const ledgerId = getCurrentLedgerId();
  let bs = getBudgets().filter(b => !(b.ledger_id === ledgerId && b.year === y && b.month === m));
  if (total > 0) bs.push({ id: Date.now() + '', ledger_id: ledgerId, year: y, month: m, category_id: null, amount: total });
  // 分类预算
  CATS.expense_personal.slice(0, 4).forEach(c => {
    const amt = parseFloat(document.getElementById('bcat_' + c.id)?.value) || 0;
    if (amt > 0) bs.push({ id: Date.now() + '_' + c.id, ledger_id: ledgerId, year: y, month: m, category_id: c.id, amount: amt });
  });
  localStorage.setItem('jtb_budgets', JSON.stringify(bs));
  document.getElementById('budget-sheet').style.display = 'none';
  showToast('预算已保存');
  updateBudgetBar();
}

function updateBudgetBar() {
  const total = getBudgetTotal();
  const exp = getMonthTxns().filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
  const wrap = document.getElementById('budget-bar-wrap');
  if (!total) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  const pct = Math.min(100, Math.round(exp / total * 100));
  const fill = document.getElementById('budget-fill');
  fill.style.width = pct + '%';
  fill.style.background = pct >= 100 ? 'var(--expense)' : pct >= 80 ? '#eda100' : 'var(--accent)';
  document.getElementById('budget-pct').textContent = pct + '%';
}

// ====== 分类管理 ======
function showCatMgr() {
  const el = document.getElementById('catmgr-list');
  const allCats = [...CATS.expense_personal, ...CATS.income_personal, ...CATS.expense_business, ...CATS.income_business];
  el.innerHTML = allCats.map(c => '<div style="padding:8px;border-bottom:1px solid var(--border);font-size:13px;">' + c.icon + ' ' + c.name + ' <span style="color:var(--ink3);font-size:11px;">[' + c.id + ']</span></div>').join('');
  document.getElementById('catmgr-sheet').style.display = 'block';
}

// Boot
updateLabels();
setType('expense');
renderCats();
updateBudgetBar();
// Dark mode restore
if (localStorage.getItem('jtb_dark') === '1') {
  document.getElementById('dark-chk').checked = true;
  toggleDark();
}
